name: NBA Live Results (per game)

on:
  schedule:
    # Avoid the top-of-hour GitHub Actions load spike. The 21:57 run sleeps
    # through 21:57-21:59 and performs the first real checks at 22:00/22:01.
    - cron: "57 21 * * *"
      timezone: "Europe/Moscow"
    # Thereafter each run starts at :02/:07/.../:57 and performs five
    # start-to-start minute ticks. The 09:57 run covers through 10:00 MSK;
    # an in-job time guard prevents any poll after 10:00.
    - cron: "2-57/5 22-23,0-9 * * *"
      timezone: "Europe/Moscow"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nba-live.yml"
      - "nba_results_live_bot.py"
      - "scripts/nba_poll_once.py"
      - "scripts/nba_poll_once_v2.py"
      - "scripts/persist_nba_markers.sh"
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Отправить ping в Telegram (не шлёт результаты)"
        type: boolean
        default: false
      list_events:
        description: "Вывести список завершённых матчей за REPORT_DATE_PT и выйти"
        type: boolean
        default: false
      report_date_pt:
        description: "PT-дата для теста (YYYY-MM-DD). Пусто = авто."
        type: string
        required: false
        default: ""
      only_event_id:
        description: "Публиковать только этот eventId (для безопасного ретро-теста)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Не отправлять в Telegram, только логи"
        type: boolean
        default: false
      alt_chat_id:
        description: "Отправить тест в другой чат (numeric chat id)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

# Production schedule/manual runs serialize against each other. Push smoke tests
# use a separate group so they can never cancel or delay live publishing.
concurrency:
  group: ${{ github.event_name == 'push' && 'nba-live-smoke' || 'nba-live' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run live bot (per minute)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEAM_EMOJI_JSON: ${{ secrets.TEAM_EMOJI_JSON }}
          DEBUG_NBA: "1"
          REPORT_DATE_PT: ${{ inputs.report_date_pt }}
          # Boolean workflow inputs must be blank when false. The legacy bot
          # uses bool(env_string), where the literal string "false" is True.
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message && '1' || '' }}
          LIST_EVENTS: ${{ inputs.list_events && '1' || '' }}
          ONLY_EVENT_ID: ${{ inputs.only_event_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ALT_CHAT_ID: ${{ inputs.alt_chat_id }}
          SMOKE_TEST: ${{ github.event_name == 'push' && '1' || '' }}
          MARKER_DIR: "posted"
        shell: bash
        run: |
          # Manual dispatch and push smoke-test = one intentional check only.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            python -u scripts/nba_poll_once_v2.py
            exit $?
          fi

          failures=0
          persist_failures=0
          polled=0

          for i in 1 2 3 4 5; do
            started=$(date +%s)
            hm=$(TZ=Europe/Moscow date +%H%M)
            hm_num=$((10#$hm))

            # Production window is inclusive: 22:00:00 through 10:00:59 MSK.
            if [ "$hm_num" -ge 2200 ] || [ "$hm_num" -le 1000 ]; then
              polled=$((polled + 1))
              echo "=== minute poll ${i}/5 at $(TZ=Europe/Moscow date +'%Y-%m-%dT%H:%M:%S%z') MSK ==="
              if ! python -u scripts/nba_poll_once_v2.py; then
                failures=$((failures + 1))
                echo "Poll ${i} failed; continuing to next minute."
              fi

              # Persist idempotency state immediately after every real tick,
              # minimizing the duplicate window if the runner dies later.
              if ! bash scripts/persist_nba_markers.sh; then
                persist_failures=$((persist_failures + 1))
              fi
            else
              echo "=== minute slot ${i}/5 outside 22:00-10:00 MSK; no poll ==="
            fi

            if [ "$i" -lt 5 ]; then
              elapsed=$(( $(date +%s) - started ))
              sleep_for=$(( 60 - elapsed ))
              if [ "$sleep_for" -gt 0 ]; then
                sleep "$sleep_for"
              fi
            fi
          done

          echo "Minute polling finished; polled=${polled} failed_ticks=${failures} marker_failures=${persist_failures}"

          # A transient source failure is recovered by the next minute. Fail the
          # job only if every real poll failed, or marker persistence failed.
          if [ "$polled" -gt 0 ] && [ "$failures" -eq "$polled" ]; then
            exit 1
          fi
          if [ "$persist_failures" -gt 0 ]; then
            exit 1
          fi

      - name: Commit markers fallback
        if: ${{ always() }}
        env:
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message && '1' || '' }}
          LIST_EVENTS: ${{ inputs.list_events && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ALT_CHAT_ID: ${{ inputs.alt_chat_id }}
          SMOKE_TEST: ${{ github.event_name == 'push' && '1' || '' }}
        shell: bash
        run: |
          # Never mutate markers in test/list/dry-run/alternate-chat/smoke modes.
          if [ "$SEND_TEST_MESSAGE" = "1" ] || [ "$LIST_EVENTS" = "1" ] || [ "$DRY_RUN" = "1" ] || [ -n "$ALT_CHAT_ID" ] || [ "$SMOKE_TEST" = "1" ]; then
            echo "Skip marker persistence (test/list/dry-run/alternate-chat/smoke mode)."
            exit 0
          fi

          bash scripts/persist_nba_markers.sh
