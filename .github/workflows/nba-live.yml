name: NBA Live Results (cron-job.org)

on:
  # Production scheduling is external: cron-job.org calls workflow_dispatch once
  # per minute. GitHub's native schedule is intentionally disabled to avoid
  # duplicate polling and its 5-minute minimum interval.
  workflow_dispatch:
    inputs:
      external_cron:
        description: "Вызов от cron-job.org"
        type: boolean
        default: false
      external_cron_epoch:
        description: "Unix time planned by cron-job.org (%cjo:unixtime%)"
        type: string
        required: false
        default: ""
      send_test_message:
        description: "Отправить ping в Telegram (не шлёт результаты)"
        type: boolean
        default: false
      list_events:
        description: "Вывести список завершённых матчей за REPORT_DATE_PT и выйти"
        type: boolean
        default: false
      report_date_pt:
        description: "PT-дата для теста (YYYY-MM-DD). Пусто = авто."
        type: string
        required: false
        default: ""
      only_event_id:
        description: "Публиковать только этот eventId (для безопасного ретро-теста)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Не отправлять в Telegram, только логи"
        type: boolean
        default: false
      alt_chat_id:
        description: "Отправить тест в другой чат (numeric chat id)"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/nba-live.yml"
      - "nba_results_live_bot.py"
      - "scripts/nba_poll_once.py"
      - "scripts/nba_poll_once_v2.py"
      - "scripts/persist_nba_markers.sh"

permissions:
  contents: write

# Never cancel a live minute tick with the next one. Push smoke tests are kept
# in a separate group so code changes cannot block production polling.
concurrency:
  group: ${{ github.event_name == 'push' && 'nba-live-smoke' || 'nba-live-external' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4

      - name: Run one NBA poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEAM_EMOJI_JSON: ${{ secrets.TEAM_EMOJI_JSON }}
          DEBUG_NBA: "1"
          REPORT_DATE_PT: ${{ inputs.report_date_pt }}
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message && '1' || '' }}
          LIST_EVENTS: ${{ inputs.list_events && '1' || '' }}
          ONLY_EVENT_ID: ${{ inputs.only_event_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ALT_CHAT_ID: ${{ inputs.alt_chat_id }}
          SMOKE_TEST: ${{ github.event_name == 'push' && '1' || '' }}
          MARKER_DIR: "posted"
          EXTERNAL_CRON: ${{ inputs.external_cron && '1' || '' }}
          EXTERNAL_CRON_EPOCH: ${{ inputs.external_cron_epoch }}
        shell: bash
        run: |
          # A push is only a safe regression test and never sends Telegram posts.
          if [ "${{ github.event_name }}" = "push" ]; then
            python -u scripts/nba_poll_once_v2.py
            exit $?
          fi

          # cron-job.org production call: exactly one poll per external minute.
          if [ "$EXTERNAL_CRON" = "1" ]; then
            planned="$EXTERNAL_CRON_EPOCH"
            if ! [[ "$planned" =~ ^[0-9]{9,12}$ ]]; then
              echo "Invalid/missing external cron epoch; refusing production poll."
              exit 1
            fi

            now=$(date +%s)
            age=$((now - planned))

            # Never replay stale queued calls after a GitHub outage/runner backlog.
            # This is the key anti-batch guard: fresh minute ticks only.
            if [ "$age" -gt 180 ] || [ "$age" -lt -120 ]; then
              echo "STALE external cron call skipped: planned=$planned age=${age}s"
              exit 0
            fi

            hm=$(TZ=Europe/Moscow date -d "@$planned" +%H%M)
            hm_num=$((10#$hm))

            # Strict production window based only on Moscow clock time.
            # Do not infer cron-job.org Test run from the epoch seconds: regular
            # cron executions can also begin a second or two after the minute.
            if [ "$hm_num" -ge 2200 ] || [ "$hm_num" -le 1000 ]; then
              echo "EXTERNAL minute poll planned=$(TZ=Europe/Moscow date -d "@$planned" +'%Y-%m-%dT%H:%M:%S%z') age=${age}s"
              python -u scripts/nba_poll_once_v2.py
              exit $?
            fi

            echo "External cron call outside 22:00-10:00 MSK; no poll."
            exit 0
          fi

          # Ordinary manual workflow_dispatch remains available for diagnostics.
          python -u scripts/nba_poll_once_v2.py

      - name: Persist markers
        if: ${{ always() }}
        env:
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message && '1' || '' }}
          LIST_EVENTS: ${{ inputs.list_events && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ALT_CHAT_ID: ${{ inputs.alt_chat_id }}
          SMOKE_TEST: ${{ github.event_name == 'push' && '1' || '' }}
        shell: bash
        run: |
          # Never mutate markers in test/list/dry-run/alternate-chat/smoke modes.
          if [ "$SEND_TEST_MESSAGE" = "1" ] || [ "$LIST_EVENTS" = "1" ] || [ "$DRY_RUN" = "1" ] || [ -n "$ALT_CHAT_ID" ] || [ "$SMOKE_TEST" = "1" ]; then
            echo "Skip marker persistence (test/list/dry-run/alternate-chat/smoke mode)."
            exit 0
          fi

          bash scripts/persist_nba_markers.sh
